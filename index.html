<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ErstesSpiel</title>
    <meta name="description" content="Aufbau- und Fabrikspiel mit Wirtschaftssimulation im Mittelalter." />
    <meta name="theme-color" content="#3b2a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="src/style.css?v=0.20.0" />
    <!-- Jede Programmdatei bekommt die Versionsnummer, damit der Browser nach
         einem Update nicht alte und neue Dateien mischt. Wird von
         tools/set-version.mjs geschrieben – nicht von Hand ändern. -->
    <script type="importmap">
    {
      "imports": {
        "./src/core/area.js": "./src/core/area.js?v=0.20.0",
        "./src/core/belts.js": "./src/core/belts.js?v=0.20.0",
        "./src/core/buildings.js": "./src/core/buildings.js?v=0.20.0",
        "./src/core/data/buildings.js": "./src/core/data/buildings.js?v=0.20.0",
        "./src/core/data/items.js": "./src/core/data/items.js?v=0.20.0",
        "./src/core/data/land.js": "./src/core/data/land.js?v=0.20.0",
        "./src/core/data/levels.js": "./src/core/data/levels.js?v=0.20.0",
        "./src/core/data/offline.js": "./src/core/data/offline.js?v=0.20.0",
        "./src/core/data/recipes.js": "./src/core/data/recipes.js?v=0.20.0",
        "./src/core/data/shop.js": "./src/core/data/shop.js?v=0.20.0",
        "./src/core/dirs.js": "./src/core/dirs.js?v=0.20.0",
        "./src/core/geometry.js": "./src/core/geometry.js?v=0.20.0",
        "./src/core/land.js": "./src/core/land.js?v=0.20.0",
        "./src/core/levels.js": "./src/core/levels.js?v=0.20.0",
        "./src/core/market.js": "./src/core/market.js?v=0.20.0",
        "./src/core/offline.js": "./src/core/offline.js?v=0.20.0",
        "./src/core/production.js": "./src/core/production.js?v=0.20.0",
        "./src/core/quests.js": "./src/core/quests.js?v=0.20.0",
        "./src/core/save.js": "./src/core/save.js?v=0.20.0",
        "./src/core/shop.js": "./src/core/shop.js?v=0.20.0",
        "./src/core/sim.js": "./src/core/sim.js?v=0.20.0",
        "./src/core/state.js": "./src/core/state.js?v=0.20.0",
        "./src/core/warehouse.js": "./src/core/warehouse.js?v=0.20.0",
        "./src/main.js": "./src/main.js?v=0.20.0",
        "./src/version.js": "./src/version.js?v=0.20.0",
        "./src/view/buildbar.js": "./src/view/buildbar.js?v=0.20.0",
        "./src/view/buildingInfo.js": "./src/view/buildingInfo.js?v=0.20.0",
        "./src/view/camera.js": "./src/view/camera.js?v=0.20.0",
        "./src/view/controller.js": "./src/view/controller.js?v=0.20.0",
        "./src/view/format.js": "./src/view/format.js?v=0.20.0",
        "./src/view/hud.js": "./src/view/hud.js?v=0.20.0",
        "./src/view/input.js": "./src/view/input.js?v=0.20.0",
        "./src/view/itemArt.js": "./src/view/itemArt.js?v=0.20.0",
        "./src/view/levels.js": "./src/view/levels.js?v=0.20.0",
        "./src/view/offline.js": "./src/view/offline.js?v=0.20.0",
        "./src/view/panels.js": "./src/view/panels.js?v=0.20.0",
        "./src/view/press.js": "./src/view/press.js?v=0.20.0",
        "./src/view/renderer.js": "./src/view/renderer.js?v=0.20.0",
        "./src/view/shop.js": "./src/view/shop.js?v=0.20.0",
        "./src/view/storage.js": "./src/view/storage.js?v=0.20.0",
        "./src/view/warehouse.js": "./src/view/warehouse.js?v=0.20.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-item" title="Gold">
          <span class="hud-icon" aria-hidden="true">🪙</span>
          <span id="hud-gold">0</span>
          <span id="hud-gold-gain" class="gold-gain" aria-hidden="true"></span>
        </div>
        <button id="btn-level" type="button" class="hud-item hud-level">
          <span class="hud-icon" aria-hidden="true">⚖️</span>
          <span>Laden-Level <span id="hud-level">1</span></span>
          <span id="hud-level-ready" class="level-ready" hidden>⬆</span>
          <span id="hud-quest-ready" class="quest-ready" hidden>❗</span>
          <span class="hud-xp" aria-hidden="true"><span id="hud-xp-fill"></span></span>
        </button>
        <div class="hud-spacer"></div>
        <button id="btn-fullscreen" type="button">Vollbild</button>
        <button id="btn-menu" type="button" aria-label="Menü">☰</button>
        <div id="hud-speed" class="hud-speed" hidden>⏩ ×10</div>
        <div id="hud-version" class="hud-version">v</div>
        <div id="menu" class="menu" hidden>
          <button id="menu-test-mode" type="button">⏩ Testmodus: aus</button>
          <button id="menu-test-pack" type="button" hidden>🎁 Testpaket: 1.000 Gold + je 50 Waren</button>
          <button id="menu-new-game" type="button">🔄 Neues Spiel</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="game" aria-label="Spielfeld"></canvas>

        <aside id="info-panel" hidden>
          <button id="info-close" type="button" aria-label="Schließen">✕</button>
          <div class="info-head">
            <span id="info-icon" class="info-icon" aria-hidden="true"></span>
            <div>
              <h2 id="info-title"></h2>
              <p id="info-meta" class="info-meta"></p>
            </div>
          </div>
          <p id="info-text"></p>
          <div id="info-body" class="info-body"></div>
          <div id="info-status" class="info-status"></div>
          <p id="info-soon" class="info-soon"></p>
          <div id="info-actions" class="panel-actions"></div>
          <div id="info-tools" class="info-tools"></div>
          <p id="info-hint" class="info-hint"></p>
        </aside>

        <div id="hint">Ziehen: verschieben · Zwei Finger: zoomen · Gebäude antippen</div>
        <div id="toast" hidden></div>

        <div id="bottom-bar">
          <button id="btn-shop" type="button" class="big-button">⚖️ Laden</button>
          <button id="btn-build" type="button" class="big-button">🔨 Bauen</button>
        </div>

        <div id="build-bar" class="bar" hidden>
          <div id="build-tools" class="build-tools"></div>
          <div class="build-sep" aria-hidden="true"></div>
          <div class="build-tab-area">
            <div id="build-tabs" class="build-tabs" role="tablist"></div>
            <div id="build-items" class="build-items"></div>
          </div>
          <button id="build-close" type="button" aria-label="Bauleiste schließen">✕</button>
        </div>

        <div id="tool-bar" class="bar" hidden>
          <span id="tool-text" class="tool-text"></span>
          <div class="tool-buttons">
            <button id="tool-rotate" type="button" title="Taste R">↻ Drehen</button>
            <button id="tool-area-erase" type="button" class="danger" hidden>🧹 Abreißen</button>
            <button id="tool-area-move" type="button" hidden>✥ Verschieben</button>
            <button id="tool-cancel" type="button">✕ Abbrechen</button>
            <button id="tool-confirm" type="button" class="primary">✓ Fertig</button>
          </div>
        </div>
      </main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-box">
        <button id="modal-close" type="button" class="modal-close" aria-label="Schließen">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="dialog" class="modal" hidden>
      <div class="modal-box dialog-box">
        <h2 id="dialog-title"></h2>
        <p id="dialog-text"></p>
        <div class="panel-actions">
          <button id="dialog-cancel" type="button">Abbrechen</button>
          <button id="dialog-ok" type="button" class="primary">OK</button>
        </div>
      </div>
    </div>

    <!-- v0.14.0: Die Fabrik holt die Zeit nach, in der das Spiel zu war -->
    <div id="catchup" class="catchup" hidden>
      <div class="catchup-box">
        <div class="catchup-icon" aria-hidden="true">⏩</div>
        <p id="catchup-text"></p>
        <div class="catchup-bar"><div id="catchup-fill"></div></div>
      </div>
    </div>

    <div id="rotate-overlay">
      <div class="rotate-icon" aria-hidden="true">📱↻</div>
      <p>Bitte dreh dein Gerät ins Querformat.</p>
    </div>

    <div id="boot-error" hidden>
      <div class="boot-error-box">
        <h2>⚠️ Das Spiel konnte nicht starten</h2>
        <p>Dein Spielstand ist sicher gespeichert. Meist hilft es, kurz zu warten und neu zu laden.</p>
        <p id="boot-error-text" class="boot-error-text"></p>
        <button id="boot-error-reload" type="button" class="primary">↻ Neu laden</button>
      </div>
    </div>

    <noscript>Dieses Spiel braucht JavaScript.</noscript>
    <script>
      // Startet das Spiel nicht, erscheint statt eines schwarzen Bildschirms
      // eine Meldung mit dem Fehlertext (für einen Screenshot an Claude).
      // Absichtlich ohne Module, damit das auch klappt, wenn Module nicht laden.
      (function () {
        var messages = [];
        function show() {
          if (window.__game) return;
          document.getElementById('boot-error-text').textContent =
            messages.join(' · ') || 'Das Spiel hat nicht rechtzeitig geladen.';
          document.getElementById('boot-error').hidden = false;
        }
        window.addEventListener(
          'error',
          function (event) {
            if (window.__game) return;
            var target = event.target;
            messages.push(event.message || ('Datei nicht geladen: ' + ((target && (target.src || target.href)) || '?')));
            setTimeout(show, 300);
          },
          true,
        );
        window.addEventListener('load', function () {
          setTimeout(show, 5000);
        });
        // Einfacher click genügt hier: Der Knopf erscheint nur ohne laufendes Spiel.
        document.getElementById('boot-error-reload').addEventListener('click', function () {
          location.reload();
        });
      })();
    </script>
    <script type="module" src="src/main.js?v=0.20.0"></script>
  </body>
</html>
