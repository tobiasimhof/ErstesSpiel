<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ErstesSpiel</title>
    <meta name="description" content="Aufbau- und Fabrikspiel mit Wirtschaftssimulation im Mittelalter." />
    <meta name="theme-color" content="#3b2a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="src/style.css?v=0.7.0" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-item" title="Gold">
          <span class="hud-icon" aria-hidden="true">🪙</span>
          <span id="hud-gold">0</span>
          <span id="hud-gold-gain" class="gold-gain" aria-hidden="true"></span>
        </div>
        <div class="hud-item">
          <span class="hud-icon" aria-hidden="true">⚖️</span>
          <span>Laden-Level <span id="hud-level">1</span></span>
        </div>
        <div class="hud-spacer"></div>
        <button id="btn-fullscreen" type="button">Vollbild</button>
        <button id="btn-menu" type="button" aria-label="Menü">☰</button>
        <div id="hud-speed" class="hud-speed" hidden>⏩ ×10</div>
        <div id="hud-version" class="hud-version">v</div>
        <div id="menu" class="menu" hidden>
          <button id="menu-test-mode" type="button">⏩ Testmodus: aus</button>
          <button id="menu-test-pack" type="button" hidden>🎁 Testpaket: 1.000 Gold + je 50 Waren</button>
          <button id="menu-new-game" type="button">🔄 Neues Spiel</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="game" aria-label="Spielfeld"></canvas>

        <aside id="info-panel" hidden>
          <button id="info-close" type="button" aria-label="Schließen">✕</button>
          <div class="info-head">
            <span id="info-icon" class="info-icon" aria-hidden="true"></span>
            <div>
              <h2 id="info-title"></h2>
              <p id="info-meta" class="info-meta"></p>
            </div>
          </div>
          <p id="info-text"></p>
          <div id="info-status" class="info-status"></div>
          <p id="info-soon" class="info-soon"></p>
          <div id="info-actions" class="panel-actions"></div>
        </aside>

        <div id="hint">Ziehen: verschieben · Zwei Finger: zoomen · Gebäude antippen</div>
        <div id="toast" hidden></div>

        <div id="bottom-bar">
          <button id="btn-shop" type="button" class="big-button">⚖️ Laden</button>
          <button id="btn-build" type="button" class="big-button">🔨 Bauen</button>
        </div>

        <div id="build-bar" class="bar" hidden>
          <div id="build-items" class="build-items"></div>
          <button id="build-close" type="button" aria-label="Bauleiste schließen">✕</button>
        </div>

        <div id="tool-bar" class="bar" hidden>
          <span id="tool-text" class="tool-text"></span>
          <div class="tool-buttons">
            <button id="tool-rotate" type="button">↻ Drehen</button>
            <button id="tool-cancel" type="button">✕ Abbrechen</button>
            <button id="tool-confirm" type="button" class="primary">✓ Fertig</button>
          </div>
        </div>
      </main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-box">
        <button id="modal-close" type="button" class="modal-close" aria-label="Schließen">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="dialog" class="modal" hidden>
      <div class="modal-box dialog-box">
        <h2 id="dialog-title"></h2>
        <p id="dialog-text"></p>
        <div class="panel-actions">
          <button id="dialog-cancel" type="button">Abbrechen</button>
          <button id="dialog-ok" type="button" class="primary">OK</button>
        </div>
      </div>
    </div>

    <div id="rotate-overlay">
      <div class="rotate-icon" aria-hidden="true">📱↻</div>
      <p>Bitte dreh dein Gerät ins Querformat.</p>
    </div>

    <noscript>Dieses Spiel braucht JavaScript.</noscript>
    <script type="module" src="src/main.js?v=0.7.0"></script>
  </body>
</html>
